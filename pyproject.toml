[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "LLM-Tabular"
version = "0.1.0"
description = "Experiments with DRL methods using LLM proposed constraints"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.120.2",
    "be-great==0.0.14",
    "cvxpy>=1.7.5",
    "joblib>=1.3",
    "kagglehub>=1.0.2",
    "langchain>=1.3.9",
    "langchain-openai>=1.3.2",
    "matplotlib>=3.10.9",
    "numpy>=1.24",
    "openai>=2.44.0",
    "packaging>=23",
    "pandas>=2",
    "psutil>=5.9",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rdt>=1.8",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "sdmetrics>=0.13",
    "sdv>=1.32.1",
    "torch>=2.0",
    "transformers>=4.51,<5",
    "wandb>=0.16",
    "xgboost>=3.2.0",
]

[project.scripts]
run-ctgan = "run_ctgan:main"
run-great = "run_great:main"
run-gaussian-copula = "run_GaussianCopula:main"
run-multirun-experiment = "multirun_experiment:main"
run-tvae = "run_tvae:main"
drl-format-synthetic-decimals = "synthesizer_workflow.format_synthetic_decimals:main"

[dependency-groups]
# tests/test_categorical_dependency.py and
# tests/test_expert_constraints_fix.py import pytest.
dev = ["pytest>=8"]

[tool.uv]
package = true

[tool.setuptools]
py-modules = [
    "multirun_experiment",
    "run_ctgan",
    "run_great",
    "run_GaussianCopula",
    "run_TabDDPM",
    "run_tvae",
    "utils",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agentic_pipeline*",
    "constraints*",
    "DRL*",
    "data_processors*",
    "evaluation*",
    "synthesizer_workflow*",
    "synthetizers*",
]
namespaces = true

[tool.setuptools.package-data]
"agentic_pipeline.equational" = ["prompt_templates/*.md"]
"agentic_pipeline.linear" = ["prompt_templates/*.md"]
"agentic_pipeline.categorical" = ["prompt_templates/*.md"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
